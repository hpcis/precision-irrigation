<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 irrigation controller voltage and power safety plan</title>
  <desc id="desc">A three-column diagram separates 3.3 volt ESP32 logic, 5 volt modules, and separately powered loads. The HC-SR04 Echo signal passes through a divider before GPIO19.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243746"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #173326; }
      .subtitle { font: 24px Arial, sans-serif; fill: #42534a; }
      .head { font: 700 30px Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 23px Arial, sans-serif; fill: #17242d; }
      .body { font: 20px Arial, sans-serif; fill: #263740; }
      .small { font: 18px Arial, sans-serif; fill: #37474f; }
      .warn { font: 700 22px Arial, sans-serif; fill: #8a271d; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfcf8"/>
  <text x="800" y="64" text-anchor="middle" class="title">Voltage and power safety plan</text>
  <text x="800" y="102" text-anchor="middle" class="subtitle">Separate logic, module power, and load power before connecting signals</text>
  <rect x="45" y="145" width="470" height="600" rx="28" fill="#eef8ef" stroke="#3f8f54" stroke-width="4"/>
  <rect x="45" y="145" width="470" height="78" rx="28" fill="#2f7d45"/>
  <rect x="45" y="195" width="470" height="28" fill="#2f7d45"/>
  <text x="280" y="196" text-anchor="middle" class="head">3.3 V LOGIC</text>
  <rect x="565" y="145" width="470" height="600" rx="28" fill="#fff7e8" stroke="#d79525" stroke-width="4"/>
  <rect x="565" y="145" width="470" height="78" rx="28" fill="#c77b05"/>
  <rect x="565" y="195" width="470" height="28" fill="#c77b05"/>
  <text x="800" y="196" text-anchor="middle" class="head">5 V MODULE POWER</text>
  <rect x="1085" y="145" width="470" height="600" rx="28" fill="#eef5fb" stroke="#2b75a8" stroke-width="4"/>
  <rect x="1085" y="145" width="470" height="78" rx="28" fill="#236b9c"/>
  <rect x="1085" y="195" width="470" height="28" fill="#236b9c"/>
  <text x="1320" y="196" text-anchor="middle" class="head">SEPARATE LOAD POWER</text>
  <text x="85" y="275" class="label">ESP32 GPIO</text>
  <text x="85" y="310" class="body">All inputs and outputs use 3.3 V logic.</text>
  <text x="85" y="343" class="warn">Never exceed 3.6 V at a GPIO.</text>
  <text x="85" y="405" class="label">Analog sensors</text>
  <text x="85" y="440" class="body">LDR output to GPIO34</text>
  <text x="85" y="472" class="body">Soil output to GPIO35</text>
  <text x="85" y="504" class="small">Keep each output between 0 V and 3.3 V.</text>
  <text x="85" y="566" class="label">Digital and I2C signals</text>
  <text x="85" y="601" class="body">DHT22 data pull-up to 3.3 V</text>
  <text x="85" y="633" class="body">LCD SDA and SCL at 3.3 V</text>
  <text x="85" y="665" class="small">Use an I2C level shifter if the backpack</text>
  <text x="85" y="692" class="small">pulls either line up to 5 V.</text>
  <text x="605" y="275" class="label">HC-SR04</text>
  <text x="605" y="310" class="body">VCC: 5 V</text>
  <text x="605" y="342" class="body">Trigger: GPIO18, 3.3 V output</text>
  <text x="605" y="374" class="body">Echo: about 5 V before conversion</text>
  <rect x="625" y="415" width="350" height="108" rx="18" fill="#ffffff" stroke="#a95c18" stroke-width="3"/>
  <text x="800" y="454" text-anchor="middle" class="label">Echo divider or level shifter</text>
  <text x="800" y="488" text-anchor="middle" class="small">Example: 1 k&#937; series + 2 k&#937; to GND</text>
  <text x="800" y="515" text-anchor="middle" class="small">Output goes to GPIO19</text>
  <text x="605" y="585" class="label">Relay board</text>
  <text x="605" y="620" class="body">Use the supply required by the board.</text>
  <text x="605" y="652" class="body">Verify 3.3 V input compatibility.</text>
  <text x="605" y="684" class="small">Do not power pumps or lamps from this rail.</text>
  <text x="1125" y="275" class="label">Loads switched by relay contacts</text>
  <text x="1125" y="320" class="body">Grow light: GPIO25 relay channel</text>
  <text x="1125" y="355" class="body">Fan: GPIO26 relay channel</text>
  <text x="1125" y="390" class="body">Irrigation: GPIO27 relay channel</text>
  <text x="1125" y="425" class="body">Tank refill: GPIO14 relay channel</text>
  <text x="1125" y="505" class="label">For every load</text>
  <text x="1125" y="545" class="body">Use a correctly sized, fused supply.</text>
  <text x="1125" y="580" class="body">Wire the load through COM and NO.</text>
  <text x="1125" y="615" class="body">Add motor or solenoid suppression.</text>
  <text x="1125" y="650" class="warn">Never use ESP32 or USB power.</text>
  <path d="M 625 470 C 580 470, 560 470, 515 470" fill="none" stroke="#243746" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="570" y="450" text-anchor="middle" class="small">Echo at 3.3 V</text>
  <path d="M 1035 625 C 1060 625, 1060 625, 1085 625" fill="none" stroke="#243746" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1060" y="600" text-anchor="middle" class="small">Relay contacts</text>
  <rect x="45" y="785" width="1510" height="78" rx="18" fill="#fff1ef" stroke="#bd3a2f" stroke-width="3"/>
  <text x="800" y="819" text-anchor="middle" class="warn">The shield's red V row is one shared rail. Verify whether its jumper selects 3.3 V or 5 V before wiring sensors.</text>
  <text x="800" y="850" text-anchor="middle" class="small">When devices need different voltages, provide separate 3.3 V and 5 V connections. Keep all required signal grounds common.</text>
</svg>

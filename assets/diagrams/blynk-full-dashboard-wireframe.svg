<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Suggested Blynk mobile dashboard layout</title>
  <desc id="desc">A phone dashboard with five sensor cards, a five-second watering button, four relay state indicators, and a system status field.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity="0.16"/></filter><style>.t{font:700 40px Arial;fill:#073b4c}.h{font:700 25px Arial;fill:#073b4c}.v{font:700 34px Arial;fill:#007c68}.p{font:21px Arial;fill:#315866}.pin{font:700 18px Consolas;fill:#087ea4}</style></defs>
  <rect width="1500" height="900" fill="#f6fffb"/>
  <text x="750" y="60" text-anchor="middle" class="t">SUGGESTED MOBILE DASHBOARD</text>
  <text x="750" y="95" text-anchor="middle" class="p">Each widget connects to the Virtual Pin printed in blue.</text>
  <rect x="430" y="125" width="640" height="730" rx="55" fill="#102a3a" filter="url(#s)"/>
  <rect x="458" y="155" width="584" height="665" rx="35" fill="#f8fafc"/>
  <rect x="665" y="137" width="170" height="20" rx="10" fill="#102a3a"/>
  <text x="750" y="205" text-anchor="middle" class="h">TU Box G1 · Smart Farm</text>

  <g transform="translate(485 235)"><rect width="255" height="105" rx="16" fill="#e6f7ef" stroke="#76caa9" stroke-width="2"/><text x="22" y="32" class="h">Light</text><text x="230" y="31" text-anchor="end" class="pin">V0</text><text x="128" y="80" text-anchor="middle" class="v">67%</text></g>
  <g transform="translate(760 235)"><rect width="255" height="105" rx="16" fill="#fff4e8" stroke="#f5b16e" stroke-width="2"/><text x="22" y="32" class="h">Temperature</text><text x="230" y="31" text-anchor="end" class="pin">V1</text><text x="128" y="80" text-anchor="middle" class="v">28.4 °C</text></g>
  <g transform="translate(485 355)"><rect width="255" height="105" rx="16" fill="#eaf4ff" stroke="#7db9e8" stroke-width="2"/><text x="22" y="32" class="h">Humidity</text><text x="230" y="31" text-anchor="end" class="pin">V2</text><text x="128" y="80" text-anchor="middle" class="v">64%</text></g>
  <g transform="translate(760 355)"><rect width="255" height="105" rx="16" fill="#eef8df" stroke="#a5ce69" stroke-width="2"/><text x="22" y="32" class="h">Soil</text><text x="230" y="31" text-anchor="end" class="pin">V3</text><text x="128" y="80" text-anchor="middle" class="v">43%</text></g>
  <g transform="translate(485 475)"><rect width="255" height="105" rx="16" fill="#e8f8fb" stroke="#6bc4d2" stroke-width="2"/><text x="22" y="32" class="h">Tank level</text><text x="230" y="31" text-anchor="end" class="pin">V4</text><text x="128" y="80" text-anchor="middle" class="v">31 cm</text></g>
  <g transform="translate(760 475)"><rect width="255" height="105" rx="16" fill="#ffeadf" stroke="#ee8650" stroke-width="2"/><text x="22" y="32" class="h">Water 5 sec</text><text x="230" y="31" text-anchor="end" class="pin">V5</text><rect x="35" y="53" width="185" height="39" rx="19" fill="#ee6c2c"/><text x="128" y="80" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">PRESS ONCE</text></g>

  <text x="750" y="620" text-anchor="middle" class="h">AUTOMATIC OUTPUT STATES</text>
  <g transform="translate(485 642)"><circle cx="18" cy="18" r="13" fill="#20b26b"/><text x="40" y="26" class="p">Lamp</text><text x="180" y="25" class="pin">V6</text></g>
  <g transform="translate(760 642)"><circle cx="18" cy="18" r="13" fill="#b8c4ca"/><text x="40" y="26" class="p">Fan</text><text x="180" y="25" class="pin">V7</text></g>
  <g transform="translate(485 690)"><circle cx="18" cy="18" r="13" fill="#20b26b"/><text x="40" y="26" class="p">Irrigation</text><text x="180" y="25" class="pin">V8</text></g>
  <g transform="translate(760 690)"><circle cx="18" cy="18" r="13" fill="#b8c4ca"/><text x="40" y="26" class="p">Refill</text><text x="180" y="25" class="pin">V9</text></g>
  <rect x="485" y="753" width="530" height="48" rx="12" fill="#dff5ea"/><text x="505" y="785" class="p">Status: AUTOMATIC CONTROL</text><text x="992" y="783" text-anchor="end" class="pin">V10</text>

  <g transform="translate(70 200)"><text class="h">Build order</text><text y="45" class="p">1. Five sensor widgets</text><text y="80" class="p">2. One push button</text><text y="115" class="p">3. Four state indicators</text><text y="150" class="p">4. One status value</text></g>
  <g transform="translate(1110 200)"><text class="h">Meaning</text><text y="45" class="p">Green state = relay ON</text><text y="80" class="p">Grey state = relay OFF</text><text y="115" class="p">V5 is a request only</text><text y="150" class="p">ESP32 stops the timer</text></g>
  <g transform="translate(70 515)"><rect width="310" height="150" rx="18" fill="#fff3e8" stroke="#ee8650" stroke-width="2"/><text x="155" y="38" text-anchor="middle" class="h">SAFE FIRST TEST</text><text x="155" y="78" text-anchor="middle" class="p">Disconnect real loads.</text><text x="155" y="111" text-anchor="middle" class="p">Watch relay LEDs only.</text></g>
  <g transform="translate(1110 515)"><rect width="320" height="150" rx="18" fill="#eaf4ff" stroke="#7db9e8" stroke-width="2"/><text x="160" y="38" text-anchor="middle" class="h">DO NOT CONFUSE</text><text x="160" y="78" text-anchor="middle" class="p">V8 = cloud channel</text><text x="160" y="111" text-anchor="middle" class="p">GPIO27 = physical pin</text></g>
</svg>
